name: Scheduled Crawlers

on:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to run"
        required: true
        default: "dnkom"
        type: choice
        options:
          - dnkom
          - gemotest
          - all
      region:
        description: "Provider region code"
        required: true
        default: "moscow"
        type: string
      mode:
        description: "Run mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - write
      run_source:
        description: "Run source"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - scheduled
          - backfill
          - ci

jobs:
  scheduled-dnkom:
    if: github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supabase preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @labmind/lab-crawlers supabase:preflight
      - name: Sync DNKOM
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DNKOM_SYNC_LIMIT: ${{ vars.DNKOM_SYNC_LIMIT }}
        run: pnpm --filter @labmind/lab-crawlers crawler:run -- --provider dnkom --region moscow --write --run-source scheduled

  scheduled-gemotest:
    if: github.event_name == 'schedule' && github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supabase preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @labmind/lab-crawlers supabase:preflight
      - name: Sync Gemotest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMOTEST_SYNC_LIMIT: ${{ vars.GEMOTEST_SYNC_LIMIT }}
        run: pnpm --filter @labmind/lab-crawlers crawler:run -- --provider gemotest --region moskva --write --run-source scheduled

  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supabase preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @labmind/lab-crawlers supabase:preflight
      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DNKOM_SYNC_LIMIT: ${{ vars.DNKOM_SYNC_LIMIT }}
          GEMOTEST_SYNC_LIMIT: ${{ vars.GEMOTEST_SYNC_LIMIT }}
        run: pnpm --filter @labmind/lab-crawlers crawler:run -- --provider "${{ inputs.provider }}" --region "${{ inputs.region }}" --${{ inputs.mode }} --run-source "${{ inputs.run_source }}"

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @labmind/lab-crawlers build
      - run: pnpm --filter @web-monitor/admin build
      - run: pnpm --filter @labmind/lab-crawlers test:dnkom-fixtures
      - run: pnpm --filter @labmind/lab-crawlers test:gemotest-fixtures
